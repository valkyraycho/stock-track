<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07070f" />
    <title>STOCK//TRACK — live US market terminal</title>
    <meta
      name="description"
      content="A personal real-time tracker for US equities. Live trade ticks over WebSocket, no backend."
    />

    <!-- Preconnect to font origins so the first paint isn't blocked on DNS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />

    <!-- Satoshi (body + display) — from Fontshare, free. Modern humanist grotesk. -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,600,700,900&display=swap"
      rel="stylesheet"
    />
    <!-- Geist Mono (numerics) + Instrument Serif (italic accent) — Google Fonts. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
